name: Daily Mokpo Illo Monitor

on:
  # 누락 방지용 다중 스케줄: 하루 여러 번 시도하되 monitor.py 의 1일 1회
  # 가드(last_sent_date)로 메시지는 하루 1통만 발송된다. GitHub 이 한 슬롯을
  # 지연/누락시켜도 뒤따르는 백업 실행이 그날치를 대신 보낸다.
  # 정시(00분)는 가장 혼잡해 누락이 잦으므로 모두 23분으로 피한다.
  schedule:
    - cron: '23 0 * * *'   # 09:23 KST — 1차(주 발송)
    - cron: '23 3 * * *'   # 12:23 KST — 백업 1
    - cron: '23 6 * * *'   # 15:23 KST — 백업 2

  # 수동 실행 가능 (테스트 시 1일 1회 가드를 무시하고 강제 발송)
  workflow_dispatch:

permissions:
  contents: write  # state.json 커밋용

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 수동 실행은 1일 1회 가드를 무시하고 강제 발송(테스트 편의).
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          if ! git diff --quiet state.json; then
            git config user.name  "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "state.json unchanged."
          fi
